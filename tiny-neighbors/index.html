<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17283e">
  <meta name="description" content="A small garden running in two Uxn ROMs. Move around and greet a neighbor.">
  <title>Tiny Neighbors — Playinghaus</title>
  <link rel="stylesheet" href="../style.css">
  <script defer src="../garden.js"></script>
  <script defer src="../app.js"></script>
</head>
<body>
<main>
  <canvas id="garden" width="128" height="96" tabindex="0" aria-label="Tiny Neighbors. Arrow keys or WASD to move, Space to greet."></canvas>
  <section class="console" aria-label="Game controls">
    <h1 class="console-heading">Tiny Neighbors</h1>
    <p id="objective" class="status" role="status">Loading…</p>
    <div class="control-bay">
      <div class="touch" role="group" aria-label="Movement controls">
        <div class="dpad">
          <button class="up" data-action="1" aria-label="Move north" disabled>↑</button>
          <button class="left" data-action="4" aria-label="Move west" disabled>←</button>
          <button class="right" data-action="2" aria-label="Move east" disabled>→</button>
          <button class="down" data-action="3" aria-label="Move south" disabled>↓</button>
        </div>
        <button class="greet" data-action="5" aria-label="Say hello" disabled>HELLO</button>
      </div>
      <p class="keyboard"><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> or WASD to move &nbsp; · &nbsp; <kbd>Space</kbd> to greet<br><kbd>P</kbd> to pause &nbsp; · &nbsp; <kbd>N</kbd> to advance one turn while paused</p>
      <div class="toolbar"><button id="play" disabled>Play</button><button id="reset" disabled>Reset</button></div>
    </div>
    <p id="error" role="alert" hidden></p>
    <a class="back" href="../">← Back to Playinghaus</a>
  </section>
</main>
<noscript>This game needs JavaScript and WebAssembly enabled.</noscript>
</body>
</html>
