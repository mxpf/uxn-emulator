<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Tiny Neighbors is a small browser-game prototype. Walk around a garden and greet a creature.">
  <title>Playinghaus — Tiny Neighbors</title>
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <a class="skip" href="#game">Skip to game</a>
  <div class="page">
    <header class="masthead">
      <a class="brand" href="./" aria-label="Playinghaus home">
        <img src="playinghaus-chrome.png" width="1942" height="809" alt="Playinghaus">
      </a>
    </header>
    <main id="game">
      <article class="featured" aria-labelledby="game-title">
        <a class="cartridge-link" href="tiny-neighbors/" aria-label="Play Tiny Neighbors">
          <img class="cartridge" src="tiny-neighbors-cartridge.png" width="1122" height="1402" fetchpriority="high" alt="Tiny Neighbors cartridge with the painted garden cover.">
        </a>
        <div class="game-copy">
          <h1 id="game-title">Tiny Neighbors</h1>
          <p>A small prototype. Walk around a garden and greet a creature. That’s it for now.</p>
          <a class="start" href="tiny-neighbors/">Start game <span aria-hidden="true">↗</span></a>
        </div>
      </article>
    </main>
  </div>
</body>
</html>
