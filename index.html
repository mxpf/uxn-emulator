<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Small games and playful tools for your browser. Tiny Neighbors, No Escape! and Sketchpad.">
  <title>Playinghaus</title>
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <a class="skip" href="#game">Skip to cartridges</a>
  <div class="page">
    <header class="masthead">
      <a class="brand" href="./" aria-label="Playinghaus home">
        <img src="playinghaus-chrome.png" width="1942" height="809" alt="Playinghaus">
      </a>
    </header>
    <main id="game" class="game">
      <h1 class="sr-only">Playinghaus games and tools</h1>
      <a class="cartridge-link" href="tiny-neighbors/" aria-label="Play Tiny Neighbors">
        <img class="cartridge" src="tiny-neighbors-cartridge.png" width="1122" height="1402" fetchpriority="high" alt="Tiny Neighbors cartridge with a cream Constellation logo and painted garden cover.">
      </a>
      <a class="cartridge-link" href="no-escape/" aria-label="Play No Escape!">
        <img class="cartridge" src="no-escape-cartridge.png" width="1122" height="1402" loading="lazy" alt="No Escape! cartridge with a cream Constellation logo and an inmate in orange inside an enclosed arena.">
      </a>
      <a class="cartridge-link" href="sketchpad/" aria-label="Open Sketchpad">
        <img class="cartridge" src="sketchpad-cartridge.png" width="1122" height="1402" loading="lazy" alt="Sketchpad cartridge with a cream Constellation logo, teal label, and a pencil drawing pixel shapes beside an eraser.">
      </a>
    </main>
  </div>
</body>
</html>
